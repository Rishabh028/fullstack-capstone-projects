<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" rx="12" fill="#0f172a"/>
  <rect x="0" y="0" width="900" height="54" fill="#1e293b"/>
  <text x="30" y="33" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">FS-02: Real-Time Presence &amp; Collaborative Awareness Protocol</text>

  <!-- Awareness Matrix Diagram -->
  <rect x="50" y="90" width="800" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="75" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Live Awareness Protocol State Broadcast</text>
  <text x="75" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Heartbeat frequency: 250ms · Clock synchronization: Vector Clocks · Disconnect Grace Period: 5000ms</text>

  <!-- Collaborators Row -->
  <g transform="translate(75, 175)">
    <!-- Alice -->
    <circle cx="20" cy="20" r="18" fill="#6366f1"/>
    <text x="20" y="25" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">A</text>
    <text x="48" y="18" fill="#f8fafc" font-size="13" font-weight="600">Alice (Owner)</text>
    <text x="48" y="34" fill="#10b981" font-size="11">● Active on Doc #12 · Ping: 8ms</text>

    <!-- Bob -->
    <circle cx="280" cy="20" r="18" fill="#10b981"/>
    <text x="280" y="25" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">B</text>
    <text x="308" y="18" fill="#f8fafc" font-size="13" font-weight="600">Bob (Editor)</text>
    <text x="308" y="34" fill="#10b981" font-size="11">● Typing in Section 3 · Ping: 12ms</text>

    <!-- Charlie -->
    <circle cx="540" cy="20" r="18" fill="#f59e0b"/>
    <text x="540" y="25" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">C</text>
    <text x="568" y="18" fill="#f8fafc" font-size="13" font-weight="600">Charlie (Editor)</text>
    <text x="568" y="34" fill="#10b981" font-size="11">● Dragging Shape · Ping: 14ms</text>
  </g>

  <!-- Awareness Payload Breakdown -->
  <rect x="50" y="265" width="800" height="190" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1"/>
  <text x="75" y="295" fill="#38bdf8" font-family="monospace" font-size="13">// Yjs Awareness Protocol Client State Payload (Broadcast via WebSocket)</text>
  <text x="75" y="325" fill="#cbd5e1" font-family="monospace" font-size="12">{</text>
  <text x="95" y="345" fill="#cbd5e1" font-family="monospace" font-size="12">  "clientID": 194827103, "user": { "id": "usr_99", "name": "Alice", "color": "#6366f1" },</text>
  <text x="95" y="365" fill="#cbd5e1" font-family="monospace" font-size="12">  "cursor": { "anchor": 412, "head": 412, "x": 582, "y": 314 },</text>
  <text x="95" y="385" fill="#cbd5e1" font-family="monospace" font-size="12">  "status": "online", "currentSelection": "Heading 2 - Multi-tenant Isolation"</text>
  <text x="75" y="405" fill="#cbd5e1" font-family="monospace" font-size="12">}</text>
  <text x="75" y="435" fill="#10b981" font-family="system-ui, sans-serif" font-size="12">✓ Zero lag observed across 50 concurrent client nodes in stress tests</text>
</svg>