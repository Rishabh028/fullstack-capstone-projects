<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" rx="12" fill="#090d16"/>
  <!-- App Header -->
  <rect x="0" y="0" width="900" height="54" fill="#131b2e"/>
  <circle cx="28" cy="27" r="6" fill="#ef4444"/>
  <circle cx="48" cy="27" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="27" r="6" fill="#10b981"/>
  <text x="100" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">FS-02: Engineering Architecture Spec · Live Notion-Style Document</text>

  <!-- Live Presence Bar -->
  <rect x="680" y="14" width="200" height="28" rx="14" fill="#1e293b"/>
  <circle cx="700" cy="28" r="10" fill="#6366f1"/>
  <text x="700" y="32" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">A</text>
  <circle cx="725" cy="28" r="10" fill="#10b981"/>
  <text x="725" y="32" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">B</text>
  <circle cx="750" cy="28" r="10" fill="#f59e0b"/>
  <text x="750" y="32" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">C</text>
  <text x="785" y="32" fill="#10b981" font-size="11" font-weight="600">● 3 Online</text>

  <!-- TipTap Toolbar -->
  <rect x="40" y="70" width="820" height="40" rx="6" fill="#1e293b"/>
  <text x="60" y="95" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">B  <tspan font-style="italic">I</tspan>  <tspan text-decoration="underline">U</tspan>  H1  H2  H3  List  Code  Table  Comment</text>

  <!-- Document Canvas -->
  <rect x="40" y="125" width="820" height="350" rx="8" fill="#131b2e"/>
  <text x="70" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Real-Time CRDT Document Architecture</text>
  <text x="70" y="200" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">All concurrent edits in this document converge deterministically without merge conflicts.</text>
  
  <!-- Alice typing cursor -->
  <line x1="680" y1="186" x2="680" y2="204" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="680,186 688,193 685,200 680,195" fill="#6366f1"/>
  <rect x="688" y="172" width="75" height="18" rx="4" fill="#6366f1"/>
  <text x="725" y="185" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Alice (Owner)</text>

  <!-- Interactive Checklist -->
  <text x="70" y="245" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SYSTEM DELIVERABLES CHECKLIST</text>
  <rect x="70" y="265" width="16" height="16" rx="4" fill="#10b981"/>
  <text x="74" y="278" fill="#ffffff" font-size="12">✓</text>
  <text x="96" y="278" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Sub-15ms WebSocket CRDT synchronization across nodes</text>

  <rect x="70" y="295" width="16" height="16" rx="4" fill="#10b981"/>
  <text x="74" y="308" fill="#ffffff" font-size="12">✓</text>
  <text x="96" y="308" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Multi-user awareness cursor tracking with color badges</text>

  <!-- Bob typing cursor in code block -->
  <rect x="70" y="335" width="760" height="110" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="85" y="365" fill="#38bdf8" font-family="monospace" font-size="12">const doc = new Y.Doc();</text>
  <text x="85" y="388" fill="#38bdf8" font-family="monospace" font-size="12">const provider = new WebsocketProvider('ws://localhost:1234', 'doc-1', doc);</text>
  <line x1="680" y1="375" x2="680" y2="393" stroke="#10b981" stroke-width="2.5"/>
  <rect x="686" y="360" width="70" height="18" rx="4" fill="#10b981"/>
  <text x="721" y="373" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Bob (Editor)</text>
</svg>