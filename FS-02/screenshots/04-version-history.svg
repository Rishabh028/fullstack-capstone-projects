<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" rx="12" fill="#0f172a"/>
  <rect x="0" y="0" width="900" height="54" fill="#1e293b"/>
  <text x="30" y="33" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">FS-02: Point-in-Time Document Snapshots &amp; One-Click Rollback</text>

  <!-- Left: Version History Modal Sidebar -->
  <rect x="40" y="80" width="340" height="390" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Document Snapshots</text>
  <rect x="250" y="98" width="110" height="24" rx="4" fill="#3b82f6"/>
  <text x="305" y="114" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">+ Save Snapshot</text>

  <!-- Snapshot 1 (Current) -->
  <rect x="55" y="140" width="310" height="65" rx="6" fill="#334155" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="165" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">v4: Final Architecture Review</text>
  <text x="70" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Created by Alice · Just now</text>
  <rect x="290" y="155" width="60" height="20" rx="4" fill="#10b981"/>
  <text x="320" y="169" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">CURRENT</text>

  <!-- Snapshot 2 -->
  <rect x="55" y="215" width="310" height="65" rx="6" fill="#1e293b"/>
  <text x="70" y="240" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">v3: TipTap Table Extension Added</text>
  <text x="70" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Created by Bob · 1 hour ago</text>
  <rect x="290" y="230" width="60" height="20" rx="4" fill="#3b82f6"/>
  <text x="320" y="244" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Restore</text>

  <!-- Snapshot 3 -->
  <rect x="55" y="290" width="310" height="65" rx="6" fill="#1e293b"/>
  <text x="70" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">v2: Added CRDT Whiteboard</text>
  <text x="70" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Created by Charlie · 3 hours ago</text>

  <!-- Snapshot 4 -->
  <rect x="55" y="365" width="310" height="65" rx="6" fill="#1e293b"/>
  <text x="70" y="390" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">v1: Initial Draft</text>
  <text x="70" y="410" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Created by Alice · Yesterday</text>

  <!-- Right: Preview & Live Rollback Mechanics -->
  <rect x="400" y="80" width="460" height="390" rx="8" fill="#131b2e" stroke="#334155" stroke-width="1"/>
  <text x="425" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Rollback Protocol Execution</text>
  <text x="425" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">When a snapshot is restored, the server re-encodes the Y.Doc state as a binary update and broadcasts it over Redis Pub/Sub.</text>
  
  <rect x="425" y="170" width="410" height="180" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="440" y="200" fill="#38bdf8" font-family="monospace" font-size="11">// Server-Side Atomic Rollback</text>
  <text x="440" y="225" fill="#cbd5e1" font-family="monospace" font-size="11">const snapshot = await prisma.documentSnapshot.findUnique(...);</text>
  <text x="440" y="250" fill="#cbd5e1" font-family="monospace" font-size="11">Y.applyUpdate(liveDoc, Buffer.from(snapshot.data, 'base64'));</text>
  <text x="440" y="275" fill="#cbd5e1" font-family="monospace" font-size="11">redisPublisher.publish(`doc:${docId}`, updatePayload);</text>
  <text x="440" y="300" fill="#10b981" font-family="monospace" font-size="11">// All connected clients update within 15ms without reload</text>

  <rect x="425" y="380" width="410" height="40" rx="6" fill="#10b981"/>
  <text x="630" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">✓ Atomic Snapshot Rollback Verified</text>
</svg>